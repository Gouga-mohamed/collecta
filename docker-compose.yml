services:
  postgres:
    image: postgres:16-alpine
    container_name: collecta-postgres
    environment:
      POSTGRES_USER: collecta
      POSTGRES_PASSWORD: collecta_dev
      POSTGRES_DB: collecta
    ports:
      # 5434 côté hôte : 5432/5433 sont déjà occupés par le PostgreSQL natif Windows
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U collecta -d collecta"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: collecta-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: src/CollectA.Api/Dockerfile
    container_name: collecta-backend
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:5000
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=collecta;Username=collecta;Password=collecta_dev"
      Jwt__Key: "your-super-secret-key-must-be-at-least-32-characters-long"
      Jwt__Issuer: CollectA
      Jwt__Audience: CollectA
      Jwt__AccessTokenExpirationMinutes: "60"
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./src:/src:ro

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: collecta-frontend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:5000
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
